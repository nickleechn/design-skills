        <path id="option-diamond-line-2" d="M889 406.5 L974 405"/>
      </g>
    </g>
    <g id="option-square" inkscape:label="Option 3 — square, unselected">
      <path id="option-square-card" fill="#FFFFFF" d="M1057 180 L1218 159 C1231 157 1238 164 1238 178 L1238 497 C1238 509 1232 515 1221 515 L1055 508 C1044 508 1039 502 1039 491 L1039 199 C1039 189 1046 181 1057 180 Z"/>
