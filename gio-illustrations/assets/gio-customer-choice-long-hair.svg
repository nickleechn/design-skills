<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1448" height="1086" viewBox="0 0 1448 1086" fill="none" role="img" aria-labelledby="title description">
  <title id="title">GIO customer considering three choices — long hair</title>
  <desc id="description">A faceless customer with long cobalt hair sits on a slim chair and gestures toward three independent, unselected option cards. Native editable vector shapes with smooth sparse curves and six solid GIO colours. No embedded raster, gradients, grain or filters. Named groups separate the cards, chair and character parts. Remove Background for transparency. No animation is applied.</desc>

