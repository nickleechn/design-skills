      <ellipse id="option-circle-symbol" cx="758.5" cy="299.8" rx="32.8" ry="40.3" fill="#0955EB"/>
      <g id="option-circle-content" stroke="#75B0FD" stroke-width="15" stroke-linecap="round">
        <path id="option-circle-line-1" d="M724 379 L795 377"/>
        <path id="option-circle-line-2" d="M724 409 L795 407.5"/>
