  <title id="title">GIO customer service representative answering the phone</title>
  <desc id="description">A slender, faceless woman seated at a slim desk, holding an orange telephone handset beside a monitor. Clean native vector shapes, solid GIO colours and no grain, texture or gradients. Background, chair, desk, figure, handset, cord, telephone base, keyboard and monitor have named editable parts.</desc>
